# Base configuration shared by every profile. Every secret comes from an environment variable;
# see .env.example. Profile files: application-dev.yml, application-test.yml, application-prod.yml.
spring:
  application:
    name: lifeledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeledger}
    username: ${DB_USERNAME:lifeledger}
    password: ${DB_PASSWORD:lifeledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render injects PORT; locally it is 8080
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

lifeledger:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}
